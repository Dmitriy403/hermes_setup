[project]
name = "hermes-telegram-bot"
version = "0.1.0"
description = "Single-operator Telegram bridge MCP server for the Hermes agent."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "python-telegram-bot>=21.0",
]

[project.scripts]
hermes-telegram-bot = "telegram_bot.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Flat layout: the package `telegram_bot` lives directly in this directory, so
# map the package name to "." (find-with-where=["."] looks for a telegram_bot/
# subdir that doesn't exist and installs nothing).
[tool.setuptools]
packages = ["telegram_bot"]

[tool.setuptools.package-dir]
"telegram_bot" = "."
