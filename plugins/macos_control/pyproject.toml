[project]
name = "hermes-macos-control"
version = "0.1.0"
description = "macOS automation MCP server for the Hermes agent (windows, screenshots, input)."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
]

[project.scripts]
hermes-macos-control = "macos_control.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Flat layout: the package `macos_control` lives directly in this directory, so
# map the package name to "." (find-with-where=["."] looks for a macos_control/
# subdir that doesn't exist and installs nothing).
[tool.setuptools]
packages = ["macos_control"]

[tool.setuptools.package-dir]
"macos_control" = "."
