[project]
name = "hermes"
version = "0.1.0"
description = "Installer that captures, installs, and verifies a Claude Code (Hermes agent) environment."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
hermes = "hermes.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
